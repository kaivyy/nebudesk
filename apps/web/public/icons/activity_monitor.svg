<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <linearGradient id="strokeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect x="40" y="40" width="432" height="432" rx="100" fill="url(#bg)" filter="url(#shadow)" stroke="#374151" stroke-width="8" />
  
  <g filter="url(#glow)">
    <path d="M 80 380 L 140 250 L 210 320 L 280 180 L 350 220 L 430 120" fill="none" stroke="url(#strokeGrad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 80 380 L 140 250 L 210 320 L 280 180 L 350 220 L 430 120 L 430 430 L 80 430 Z" fill="url(#strokeGrad)" opacity="0.15" />
  </g>
  
  <g stroke="#374151" stroke-width="2" opacity="0.5">
    <line x1="80" y1="120" x2="430" y2="120" />
    <line x1="80" y1="206" x2="430" y2="206" />
    <line x1="80" y1="293" x2="430" y2="293" />
    <line x1="80" y1="380" x2="430" y2="380" />
  </g>
</svg>