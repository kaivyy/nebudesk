<!doctype html><html lang="en"><head><base href="http://example.com/"><title>Example Domain</title><link rel="icon" href="data:,"><meta name="viewport" content="width=device-width, initial-scale=1"><style>body{background:#eee;width:60vw;margin:15vh auto;font-family:system-ui,sans-serif}h1{font-size:1.5em}div{opacity:0.8}a:link,a:visited{color:#348}</style></head><body><div><h1>Example Domain</h1><p>This domain is for use in documentation examples without needing permission. Avoid use in operations.</p><p><a href="https://iana.org/domains/example">Learn more</a></p></div>
    <script>
    (function() {
      // Override window.location assignments
      var proxyBase = window.location.origin + 'http://127.0.0.1:3030/api/browser/proxy?url=';
      var origin = 'http://example.com';
      
      // Intercept form submissions
      document.addEventListener('submit', function(e) {
        var form = e.target;
        if (form.tagName !== 'FORM') return;
        var action = form.getAttribute('action') || '';
        if (action && !action.includes('http://127.0.0.1:3030/api/browser/proxy?url=')) {
          e.preventDefault();
          var formData = new FormData(form);
          var params = new URLSearchParams(formData);
          var fullUrl;
          if (action.startsWith('http')) {
            fullUrl = action;
          } else if (action.startsWith('/')) {
            fullUrl = origin + action;
          } else {
            fullUrl = origin + '/' + action;
          }
          if (form.method && form.method.toUpperCase() === 'GET') {
            fullUrl = fullUrl.split('?')[0] + '?' + params.toString();
          }
          window.parent.postMessage({ type: 'NEBU_NAVIGATE', url: fullUrl }, '*');
        }
      }, true);
      
      // Intercept link clicks
      document.addEventListener('click', function(e) {
        var a = e.target;
        while (a && a.tagName !== 'A') a = a.parentElement;
        if (!a || !a.href) return;
        var href = a.href;
        // Skip javascript: and # links
        if (href.startsWith('javascript:') || href === '#') return;
        e.preventDefault();
        e.stopPropagation();
        window.parent.postMessage({ type: 'NEBU_NAVIGATE', url: href }, '*');
      }, true);
    })();
    </script></body></html>
